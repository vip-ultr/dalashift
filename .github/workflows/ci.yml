name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The Node 20 runtime these actions targeted was removed from
      # GitHub-hosted runners on 16 September 2026. Every action below is on
      # a Node 24 release. See docs/decisions/ADR-0010-github-actions-node24.md.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check documentation links
        run: pnpm validate:links

      - name: Check writing conventions
        run: pnpm validate:style

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so gitleaks can scan commits rather than only the
          # working tree.
          fetch-depth: 0

      - name: Scan tracked files for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR commenting needs a token that can write to pull requests. The
          # workflow deliberately runs with read-only permissions, so the
          # comment step would fail with "Resource not accessible by
          # integration" and fail the whole job. The scan itself still runs
          # and still fails the job when it finds something.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
